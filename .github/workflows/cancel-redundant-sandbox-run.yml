name: Cancel Redundant Sandbox Run

on:
  push:
    branches:
      - agent/operating-loop-probe-v0
    paths:
      - .github/workflows/cancel-redundant-sandbox-run.yml

permissions:
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel older queued sandbox deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code="000"
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/cancel.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/32050771326/cancel" || true)
            if [ "$code" = "202" ] || [ "$code" = "409" ]; then
              echo "redundant sandbox run cancel response HTTP $code"
              exit 0
            fi
            echo "cancel attempt $attempt returned HTTP $code"
            sleep 3
          done
          cat /tmp/cancel.json || true
          exit 1
