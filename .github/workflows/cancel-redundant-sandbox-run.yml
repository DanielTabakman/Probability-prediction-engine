name: Cancel Redundant Sandbox Run

on:
  push:
    branches:
      - agent/operating-loop-probe-v0
    paths:
      - .github/workflows/cancel-redundant-sandbox-run.yml

permissions:
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel older queued sandbox deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/cancel.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/32050771326/cancel")
          if [ "$code" != "202" ] && [ "$code" != "409" ]; then
            echo "cancel returned HTTP $code"
            cat /tmp/cancel.json
            exit 1
          fi
          echo "redundant sandbox run cancel response HTTP $code"
