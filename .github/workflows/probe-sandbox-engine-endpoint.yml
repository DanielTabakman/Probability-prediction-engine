name: Probe Sandbox Engine Endpoint

on:
  push:
    branches:
      - agent/operating-loop-probe-v0
    paths:
      - .github/workflows/probe-sandbox-engine-endpoint.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      ENGINE_URL: ${{ secrets.MARKET_STRUCTURE_ENGINE_URL }}
      ENGINE_TOKEN: ${{ secrets.MARKET_STRUCTURE_ENGINE_TOKEN }}
    steps:
      - name: Probe engine routes without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ENGINE_URL:-}"
          test -n "${ENGINE_TOKEN:-}"
          base="${ENGINE_URL%/}"
          latest_code=$(curl -sS -o /tmp/latest.json -w '%{http_code}' --max-time 30 -H "Authorization: Bearer ${ENGINE_TOKEN}" "${base}/v1/structure/latest?source=ndax" || true)
          replay_code=$(curl -sS -o /tmp/replay.json -w '%{http_code}' --max-time 60 -H "Authorization: Bearer ${ENGINE_TOKEN}" -H 'Content-Type: application/json' -d '{"source":"ndax","anchor_start_at":1786737600,"anchor_end_at":1786737600,"forward_seconds":14400,"min_persistence":2,"touch_bps":10,"outcome_bps":25,"outcome_horizon_seconds":1800,"outcome_mode":"reaction","max_path_points":10}' "${base}/v1/research/sandbox-replay" || true)
          echo "latest_http=${latest_code}"
          echo "replay_http=${replay_code}"
          python - <<'PY'
          import json
          from pathlib import Path
          for label,path in [('latest','/tmp/latest.json'),('replay','/tmp/replay.json')]:
              try:
                  value=json.loads(Path(path).read_text())
              except Exception:
                  print(label+'_summary=parse_failed')
                  continue
              if not isinstance(value,dict):
                  print(label+'_summary=non_object')
                  continue
              safe={k:value[k] for k in ('status','scientific_label','replay_version','detail','canonical_research_effect') if k in value}
              if isinstance(value.get('aggregate'),dict):
                  safe['aggregate_keys']=sorted(value['aggregate'].keys())
              print(label+'_summary='+json.dumps(safe,sort_keys=True))
          PY
