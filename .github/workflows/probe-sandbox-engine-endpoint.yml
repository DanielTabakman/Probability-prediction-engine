name: Probe Sandbox Engine Endpoint

on:
  push:
    branches:
      - agent/operating-loop-probe-v0
    paths:
      - .github/workflows/probe-sandbox-engine-endpoint.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      ENGINE_URL: ${{ secrets.MARKET_STRUCTURE_ENGINE_URL }}
      ENGINE_TOKEN: ${{ secrets.MARKET_STRUCTURE_ENGINE_TOKEN }}
    steps:
      - name: Probe engine routes through configured adapter
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ENGINE_URL:-}"
          test -n "${ENGINE_TOKEN:-}"
          python - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import urlparse, urlunparse, urlencode
          configured=os.environ['ENGINE_URL'].strip()
          if '://' not in configured:
              configured='https://'+configured
          base=urlparse(configured)
          def resolve(path_and_query):
              desired=urlparse('https://engine.local'+path_and_query)
              if base.path == '/status':
                  return urlunparse((base.scheme,base.netloc,base.path,base.params,urlencode({'engine_path':desired.path + (('?' + desired.query) if desired.query else '')}),base.fragment))
              return urlunparse((base.scheme,base.netloc,desired.path,desired.params,desired.query,base.fragment))
          Path('/tmp/latest_url').write_text(resolve('/v1/structure/latest?source=ndax'))
          Path('/tmp/replay_url').write_text(resolve('/v1/research/sandbox-replay'))
          PY
          latest_url=$(cat /tmp/latest_url)
          replay_url=$(cat /tmp/replay_url)
          latest_code=$(curl -sS -o /tmp/latest.json -w '%{http_code}' --max-time 30 -H "Authorization: Bearer ${ENGINE_TOKEN}" "$latest_url" || true)
          replay_code=$(curl -sS -o /tmp/replay.json -w '%{http_code}' --max-time 120 -H "Authorization: Bearer ${ENGINE_TOKEN}" -H 'Content-Type: application/json' -d '{"source":"ndax","anchor_start_at":1786737600,"anchor_end_at":1786737600,"forward_seconds":14400,"min_persistence":2,"touch_bps":10,"outcome_bps":25,"outcome_horizon_seconds":1800,"outcome_mode":"reaction","max_path_points":10}' "$replay_url" || true)
          echo "latest_http=${latest_code}"
          echo "replay_http=${replay_code}"
          python - <<'PY'
          import json
          from pathlib import Path
          for label,path in [('latest','/tmp/latest.json'),('replay','/tmp/replay.json')]:
              try:
                  value=json.loads(Path(path).read_text())
              except Exception:
                  print(label+'_summary=parse_failed')
                  continue
              if not isinstance(value,dict):
                  print(label+'_summary=non_object')
                  continue
              safe={k:value[k] for k in ('status','scientific_label','replay_version','detail','canonical_research_effect','schema_version') if k in value}
              if isinstance(value.get('aggregate'),dict):
                  safe['aggregate_keys']=sorted(value['aggregate'].keys())
              print(label+'_summary='+json.dumps(safe,sort_keys=True))
          PY
