name: Research Runtime Discovery

on:
  push:
    branches:
      - agent/operating-loop-probe-v0
    paths:
      - .github/workflows/research-runtime-discovery.yml

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect research runtime safely
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          command_timeout: 5m
          script: |
            set -eu
            echo '=== HOST ==='
            hostname
            uname -srmo
            echo '=== CANDIDATE DIRECTORIES ==='
            find /opt /home -maxdepth 4 -type d \( -iname '*market*structure*' -o -iname '*oct*' -o -iname '*msos*' \) -print 2>/dev/null | sort | head -200 || true
            echo '=== COMPOSE FILE PATHS ==='
            find /opt /home -maxdepth 5 -type f \( -name 'docker-compose*.yml' -o -name 'docker-compose*.yaml' -o -name 'compose.yml' -o -name 'compose.yaml' \) -print 2>/dev/null | sort | head -200 || true
            echo '=== RUNNING CONTAINERS ==='
            docker ps --format '{{.Names}} | {{.Image}} | {{.Ports}}' 2>/dev/null || true
            echo '=== RELEVANT SERVICES ==='
            systemctl list-units --type=service --all --no-pager 2>/dev/null | grep -Ei 'market|structure|oct|msos|signal|status' || true
            echo '=== LISTENERS ==='
            ss -ltnp 2>/dev/null | grep -E ':(8767|8766|8088|3000|3001|8501)\b' || true
