name: Probe Condor SSH Secret Availability

on:
  push:
    branches:
      - agent/operating-loop-probe-v0
    paths:
      - .github/workflows/probe-condor-ssh-secrets.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CONDOR_HOST: ${{ secrets.CONDOR_HOST }}
      CONDOR_USER: ${{ secrets.CONDOR_USER }}
      CONDOR_SSH_PRIVATE_KEY: ${{ secrets.CONDOR_SSH_PRIVATE_KEY }}
      CONDOR_SSH_KEY: ${{ secrets.CONDOR_SSH_KEY }}
      CONDOR_VM_HOST: ${{ secrets.CONDOR_VM_HOST }}
      CONDOR_VM_USER: ${{ secrets.CONDOR_VM_USER }}
      CONDOR_VM_SSH_PRIVATE_KEY: ${{ secrets.CONDOR_VM_SSH_PRIVATE_KEY }}
      OCT_HOST: ${{ secrets.OCT_HOST }}
      OCT_USER: ${{ secrets.OCT_USER }}
      OCT_SSH_PRIVATE_KEY: ${{ secrets.OCT_SSH_PRIVATE_KEY }}
      RESEARCH_HOST: ${{ secrets.RESEARCH_HOST }}
      RESEARCH_USER: ${{ secrets.RESEARCH_USER }}
      RESEARCH_SSH_PRIVATE_KEY: ${{ secrets.RESEARCH_SSH_PRIVATE_KEY }}
      PORO_HOST: ${{ secrets.PORO_HOST }}
      PORO_USER: ${{ secrets.PORO_USER }}
      PORO_SSH_PRIVATE_KEY: ${{ secrets.PORO_SSH_PRIVATE_KEY }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          for name in CONDOR_HOST CONDOR_USER CONDOR_SSH_PRIVATE_KEY CONDOR_SSH_KEY CONDOR_VM_HOST CONDOR_VM_USER CONDOR_VM_SSH_PRIVATE_KEY OCT_HOST OCT_USER OCT_SSH_PRIVATE_KEY RESEARCH_HOST RESEARCH_USER RESEARCH_SSH_PRIVATE_KEY PORO_HOST PORO_USER PORO_SSH_PRIVATE_KEY; do
            if [ -n "${!name:-}" ]; then echo "$name=present"; else echo "$name=absent"; fi
          done
